plugins {
    id 'com.android.application'
}

// Dónde Room deja el JSON del esquema en cada build.
def roomSchemaDir = "$projectDir/schemas"

android {
    namespace 'app.mapero.wifi'
    compileSdk 34

    defaultConfig {
        applicationId "app.mapero.wifi"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        // El esquema se versiona en app/schemas para que las migraciones se
        // puedan verificar con MigrationTestHelper. Sin esto, un error en una
        // migración solo aparece en el dispositivo, con los datos del usuario ya
        // adentro.
        test {
            assets.srcDirs += "$projectDir/schemas"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        "-Aroom.schemaLocation=$roomSchemaDir".toString(),
        "-Aroom.incremental=true".toString(),
    ]
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    // OSMDroid (mapa OpenStreetMap)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Room + SQLite
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Tests unitarios de la lógica pura (Trilateration, SignalAggregator).
    // Corren en la JVM, sin emulador.
    testImplementation 'junit:junit:4.13.2'
}
