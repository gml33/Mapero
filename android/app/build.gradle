plugins {
    id 'com.android.application'
}

// Dónde Room deja el JSON del esquema en cada build.
def roomSchemaDir = "$projectDir/schemas"

android {
    namespace 'app.mapero.wifi'
    compileSdk 34

    defaultConfig {
        applicationId "app.mapero.wifi"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        // El esquema se versiona en app/schemas para que las migraciones se puedan
        // verificar con MigrationTestHelper. Los tests unitarios leen los assets
        // del variant de la app, no los del source set `test`, así que el
        // directorio va en `main`. Son unos pocos KB.
        main {
            assets.srcDirs += "$projectDir/schemas"
        }
    }

    testOptions {
        // Robolectric necesita los recursos para correr en la JVM.
        unitTests {
            includeAndroidResources = true
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        "-Aroom.schemaLocation=$roomSchemaDir".toString(),
        "-Aroom.incremental=true".toString(),
    ]
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    // OSMDroid (mapa OpenStreetMap)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Room + SQLite
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Tests unitarios de la lógica pura (Trilateration, SignalAggregator) y de
    // las migraciones de Room. Corren en la JVM, sin emulador.
    testImplementation 'junit:junit:4.13.2'
    // MigrationTestHelper sobre Robolectric: verifica que la migración produzca
    // el esquema que Room espera, sin necesidad de un dispositivo.
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // Declarado como dependencia para que Gradle lo resuelva y lo cachee. Si no,
    // Robolectric lo baja a ~/.m2 la primera vez que corre un test, y el cache
    // de CI no cubre ese directorio. Es el build de API 34 que usa @Config.
    testImplementation 'org.robolectric:android-all-instrumented:14-robolectric-10818077-i7'
}
